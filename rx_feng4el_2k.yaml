%YAML 1.2
---
# 2048-channel feng4el RX config. The packet is a 4202 B L2 frame
# (IP total length 4188), and this repo's proven 8256 B ULA jumbo path
# sized buf_size to hold the full frame/heap instead of relying on
# multi-stride packet assembly, so this MR uses the next 128 B-aligned
# size above 4202 B.
# Host-memory RX for the real RFSoC feng4el stream on digilab-transmit.
# The RFSoC 100G QSFP is cabled to ens5f0np0, MAC b8:ce:f6:e5:6b:5a.
# 2048-channel feng4el wire contract: UDP dst 60000, payload 4160 B
# (64 B CASPER header + 4096 B spectrum), seq@48, elem@52.
# Channels are natural order in gate builds: wire channel == FFT bin, freq MHz = 3.84*bin.
daqiri:
  cfg:
    version: 1
    stream_type: "raw"
    engine: "ibverbs"
    master_core: 3
    rx_meta_buffers: 65536
    debug: false
    log_level: "info"
    loopback: ""

    memory_regions:
    - name: "Data_RX_HOST"
      kind: "huge"
      affinity: 0
      num_bufs: 16384
      buf_size: 4224

    interfaces:
    - name: "rx_port"
      address: 0000:17:00.0
      rx:
        flow_isolation: true
        queues:
        - name: "rx_q_0"
          id: 0
          cpu_core: 9
          batch_size: 1024
          memory_regions:
            - "Data_RX_HOST"
        flows:
        - name: "flow_0"
          id: 0
          action: {type: queue, id: 0}
          match: {udp_dst: 60000}
